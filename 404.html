  <!-- Tema: se aplica antes del primer pintado para evitar el parpadeo (único script inline). -->
  <script>
    (function aplicarTemaInicial() {
      let temaGuardado = null;
      try {
        temaGuardado = localStorage.getItem('theme');
      } catch (error) {
        temaGuardado = null;
      }
      const esOscuro = temaGuardado
        ? temaGuardado === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.add(esOscuro ? 'dark-background' : 'light-background');
    })();
  </script>
