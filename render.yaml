services:
  - type: web
    name: portfolio-web-daniel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: portfolio_daniel
      - key: ALLOWED_ORIGINS
        value: https://dsalado97.github.io
